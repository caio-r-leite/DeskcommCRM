name: Validar layout da Inbox

on:
  push:
    branches: [codex/validacao-integracao-20261120]

permissions:
  contents: read

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[inbox]') && !contains(github.event.head_commit.message, '[inbox-arm64]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5

      - name: Compilar a versão candidata
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-server-key
          NEXT_PUBLIC_APP_URL: https://placeholder.invalid
          NEXT_PUBLIC_ADMIN_URL: https://placeholder.invalid
          SENTRY_DSN: "off"
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Conferir o artefato
        run: test -f .next/standalone/server.js && test -d .next/static

  navegador:
    if: contains(github.event.head_commit.message, '[inbox]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 46f7efabbe93d6b9d179adea9a23b6eb97b11ad7
          persist-credentials: false

      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Preparar Supabase descartável
        shell: bash
        run: |
          set -euo pipefail
          migrations_aux=$(mktemp -d)
          mv supabase/migrations "$migrations_aux/"
          trap 'rmdir supabase/migrations && mv "$migrations_aux/migrations" supabase/' EXIT
          mkdir supabase/migrations
          SUPABASE_INTERNAL_IMAGE_REGISTRY="" supabase start -x studio,postgres-meta > /tmp/deskcomm-supabase.log 2>&1 || {
            grep -Ei 'error|failed|timeout' /tmp/deskcomm-supabase.log | tail -15
            exit 1
          }
          db_url='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$db_url" -v ON_ERROR_STOP=1 -q <<'SQL'
          create schema if not exists extensions;
          create extension if not exists "uuid-ossp" with schema extensions;
          create extension if not exists pgcrypto with schema extensions;
          create extension if not exists vector with schema public;
          create extension if not exists citext with schema public;
          create extension if not exists pg_trgm with schema public;
          SQL
          psql "$db_url" -v ON_ERROR_STOP=1 -q -f supabase/baseline.sql
          docker restart supabase_realtime_deskcomm-crm

      - name: Gerar o ambiente de teste
        run: |
          pnpm e2e:env
          grep -vE '^[[:space:]]*(#|$)' .env.e2e >> "$GITHUB_ENV"

      - name: Verificar tipos do app e dos testes
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Compilar com o ambiente de teste
        run: pnpm e2e:build
        env:
          SENTRY_DSN: "off"

      - name: Instalar o Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Testar calendário, menu e ações no card da Inbox
        run: >-
          pnpm exec playwright test --workers=1 --reporter=list
          tests/e2e/inbox-busca-e-filtros-dizem-a-verdade.spec.ts --grep @layout

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capturas-inbox-layout
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  empacotar-arm64:
    if: contains(github.event.head_commit.message, '[inbox]')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - servico: app
            dockerfile: Dockerfile
    env:
      RELEASE_COMMIT: 46f7efabbe93d6b9d179adea9a23b6eb97b11ad7
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 46f7efabbe93d6b9d179adea9a23b6eb97b11ad7
          persist-credentials: false

      - name: Construir imagem ARM64
        env:
          SERVICO: ${{ matrix.servico }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          tag="deskcomm-${SERVICO}:integracao-${RELEASE_COMMIT:0:9}"
          docker build --platform linux/arm64 --file "$DOCKERFILE" --tag "$tag" \
            --label "org.opencontainers.image.revision=$RELEASE_COMMIT" \
            --build-arg "APP_VERSION=${RELEASE_COMMIT:0:9}" --build-arg NODE_HEAP_MB=6144 .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$tag")" = linux/arm64
          docker save "$tag" | gzip -1 > "deskcomm-${SERVICO}-arm64.tar.gz"
          sha256sum "deskcomm-${SERVICO}-arm64.tar.gz" > "deskcomm-${SERVICO}-arm64.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: deskcomm-${{ matrix.servico }}-arm64
          path: |
            deskcomm-${{ matrix.servico }}-arm64.tar.gz
            deskcomm-${{ matrix.servico }}-arm64.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
